name: Build Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - atlasfish/mobile-control
    paths:
      - 'packages/happy-app/**'
      - 'packages/happy-wire/**'
      - 'patches/**'
      - 'scripts/postinstall.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-preview-apk.yml'

permissions:
  contents: read

concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: preview
      NODE_ENV: production
      SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: packages/happy-app
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Restore preview signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HAPPY_PREVIEW_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > packages/happy-app/android/app/happy-preview.jks

      - name: Build signed preview APK
        working-directory: packages/happy-app/android
        env:
          STORE_PASSWORD: ${{ secrets.HAPPY_PREVIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAPPY_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HAPPY_PREVIEW_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease --build-cache --no-daemon
          -PHAPPY_PREVIEW_STORE_FILE=happy-preview.jks
          -PHAPPY_PREVIEW_STORE_PASSWORD="$STORE_PASSWORD"
          -PHAPPY_PREVIEW_KEY_ALIAS="$KEY_ALIAS"
          -PHAPPY_PREVIEW_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          LATEST_BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$LATEST_BUILD_TOOLS/apksigner" verify --verbose packages/happy-app/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: happy-preview-${{ github.run_number }}
          path: packages/happy-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
